name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('client/**/*.gradle*', 'client/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: client

      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: client

      - name: Rename APK
        run: |
          mv client/app/build/outputs/apk/release/app-release-unsigned.apk client/app/build/outputs/apk/release/socketman-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SocketMan ${{ github.ref_name }}
          generate_release_notes: true
          files: client/app/build/outputs/apk/release/socketman-${{ github.ref_name }}.apk
