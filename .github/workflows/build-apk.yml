name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('client/**/*.gradle*', 'client/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: client

      - name: Prepare Signing Keystore
        id: setup-keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using production keystore provided via repository secrets."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks
            echo "KEYSTORE_FILE=$(pwd)/keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No KEYSTORE_BASE64 secret found; generating self-signed CI release keystore..."
            keytool -genkeypair -v \
              -keystore keystore.jks \
              -alias socketman \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass socketmanpass \
              -keypass socketmanpass \
              -dname "CN=SocketMan, OU=NIBM, O=IoT, C=LK"
            echo "KEYSTORE_FILE=$(pwd)/keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=socketmanpass" >> $GITHUB_ENV
            echo "KEY_ALIAS=socketman" >> $GITHUB_ENV
            echo "KEY_PASSWORD=socketmanpass" >> $GITHUB_ENV
          fi
        working-directory: client

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: client

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          APK_FILE=$(find client/app/build/outputs/apk/release -name "*.apk" ! -name "*-unsigned.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Looking for any generated APK..."
            APK_FILE=$(find client/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK found in client/app/build/outputs/apk/release"
            exit 1
          fi
          echo "Found release APK: $APK_FILE"
          cp "$APK_FILE" "release-output/socketman-${{ github.ref_name }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SocketMan ${{ github.ref_name }}
          generate_release_notes: true
          files: release-output/socketman-${{ github.ref_name }}.apk
